<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wudok – Next-Gen AI Engineering Platform</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0b0f19; 
      color: #f3f4f6; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
    }
    .card { 
      max-width: 600px; 
      padding: 40px; 
      text-align: center; 
    }
    h1 { 
      font-size: 2.75rem; 
      margin-bottom: 12px; 
      background: linear-gradient(135deg, #60a5fa, #a855f7); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }
    p { 
      font-size: 1.15rem; 
      color: #9ca3af; 
      line-height: 1.6; 
      margin-bottom: 28px; 
    }
    .badge { 
      display: inline-block; 
      padding: 6px 14px; 
      background: rgba(99,102,241,0.15); 
      color: #818cf8; 
      border-radius: 999px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      margin-bottom: 20px; 
    }
    .btn { 
      display: inline-block; 
      padding: 12px 28px; 
      background: #2563eb; 
      color: #fff; 
      text-decoration: none; 
      border-radius: 8px; 
      font-weight: 500; 
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 Stealth Mode</div>
    <h1>Wudok</h1>
    <p>Empowering software engineering teams with intelligent AI agents, automated workflow orchestration, and deep codebase analytics.</p>
    <a href="mailto:contact@wudok.site" class="btn">Contact Us</a>
  </div>
</body>
</html>
